# Cedron: actualizacion automatica cada hora.
# Recoge datos, calcula indicadores, guarda el historico en el repositorio y
# publica la web en GitHub Pages. Si una fuente falla 3 veces seguidas, abre
# una incidencia en GitHub (que te llega por correo).
name: Actualizar Cedron

on:
  schedule:
    - cron: "17 * * * *"      # cada hora, minuto 17 (UTC); evita la hora en punto, muy saturada
  workflow_dispatch:           # boton "Run workflow" para lanzarlo a mano
    inputs:
      forzar:
        description: "Pedir todas las fuentes aunque no toque"
        type: boolean
        default: false
      resumen:
        description: "Enviar ahora el resumen semanal (prueba)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["config.yaml", "templates/**", "static/**", "cedron/**"]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: cedron
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2       # la version anterior, para comprobar que no se pierde ninguna prevision

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Pruebas
        run: python -m unittest discover tests

      # Modelo de traduccion de titulares (~3 GB): se guarda entre ejecuciones para no
      # bajarlo cada hora. La clave lleva la version fijada en config.yaml.
      - name: Modelo de traduccion (guardado)
        if: github.event_name != 'push'
        uses: actions/cache@v4
        with:
          path: ~/.cache/cedron/modelos
          key: traductor-madlad-aa32bbdeba7880eff2096ec044cb155a340a9400

      - name: Recoger datos y generar la web
        env:
          METALCHARTS_KEY: ${{ secrets.METALCHARTS_KEY }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
          NEWSDATA_KEY: ${{ secrets.NEWSDATA_KEY }}
          CEDRON_PASSWORD: ${{ secrets.CEDRON_PASSWORD }}
          CEDRON_RESUMEN: ${{ inputs.resumen && '1' || '' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python run.py --solo-web
          elif [ "${{ inputs.forzar }}" = "true" ]; then
            python run.py --forzar
          else
            python run.py
          fi

      - name: Guardar datos en el repositorio
        run: |
          git config user.name "cedron-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "Datos $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          fi

      - name: Avisar si alguna fuente falla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titulo="Cedron: fuentes con fallos"
          abierta=$(gh issue list --state open --search "\"$titulo\" in:title" --json number --jq '.[0].number')
          # Un solo aviso al empezar el problema y otro al resolverse (no uno por hora)
          if [ -f alertas.md ]; then
            if [ -z "$abierta" ]; then
              gh issue create --title "$titulo" --body-file alertas.md
            fi
          elif [ -n "$abierta" ]; then
            gh issue close "$abierta" --comment "Todas las fuentes vuelven a responder."
          fi

      # Resumen semanal: los lunes (config.yaml, novedades.correo) se abre una incidencia con
      # lo que ha cambiado; GitHub la envia por correo. Se cierra la de la semana anterior.
      - name: Enviar el resumen semanal
        if: hashFiles('resumen_semanal.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create resumen-semanal --color 2F7D6B --description "Resumen semanal de Cedron" 2>/dev/null || true
          anteriores=$(gh issue list --state open --label resumen-semanal --json number --jq '.[].number')
          gh issue create --title "Cedron: resumen semanal ($(TZ=Europe/Madrid date +'%d/%m/%Y'))" --label resumen-semanal --body-file resumen_semanal.md
          for n in $anteriores; do gh issue close "$n"; done

      # La web solo se publica si existe la contrasena (secreto CEDRON_PASSWORD):
      # sin ella, nunca se publica nada sin cifrar.
      - name: Comprobar contraseña
        id: clave
        env:
          P: ${{ secrets.CEDRON_PASSWORD }}
        run: echo "ok=$([ -n "$P" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.clave.outputs.ok == 'true'
        uses: actions/configure-pages@v5
      - if: steps.clave.outputs.ok == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - if: steps.clave.outputs.ok == 'true'
        id: publicar
        uses: actions/deploy-pages@v4
