              tienda: {producto: "ACEITE DE GIRASOL", unidad: "€/litro"}
            global:
              fuente: pink
              serie: "Sunflower oil"
              factor: 0.00092        # de $/tonelada a $/litro
              unidad: "$/litro"
              frecuencia: mensual
              nota: "Precio de referencia mundial (Banco Mundial)"
        - id: patata
          nombre: "Patata"
          ambitos:
            espana:
              fuente: mapa
              producto: "Patata"
              factor: 0.01
              unidad: "€/kg"
              frecuencia: semanal
              nota: "Precio en origen (lo que cobra el agricultor), media nacional"
              tienda: {producto: "PATATAS FRESCAS", unidad: "€/kg"}
        - id: tomate
