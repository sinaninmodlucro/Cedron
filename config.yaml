# =============================================================================
# CEDRON - Configuracion general
# Este es el UNICO archivo que hace falta tocar para ajustar el comportamiento
# de la web. Cada parametro lleva una explicacion. Tras cambiarlo, la siguiente
# actualizacion automatica (cada hora) ya lo aplica.
# =============================================================================

sitio:
  nombre: "Cedron"
  lema: "Análisis independiente de metales preciosos y materias primas"
  url: "https://cedron.example"        # cambiar cuando tengamos dominio
  autor: "Equipo Cedron"               # quien firma los analisis (exigido por MAR)
  contacto: "contacto@cedron.example"
  idioma: "es"
  zona_horaria: "Europe/Madrid"

# -----------------------------------------------------------------------------
# Activos cubiertos. 'pink_sheet' es el nombre exacto de la serie en el Banco
# Mundial (historico mensual, licencia CC BY 4.0). 'metalcharts' es el simbolo
# para el precio actual. 'cftc' es el codigo de contrato de la CFTC.
# -----------------------------------------------------------------------------
activos:
  - id: oro
    nombre: "Oro"
    simbolo: XAU
    unidad: "onza troy"
    metalcharts: XAU
    pink_sheet: "Gold"
    cftc: "088691"
    macro: true
    descripcion: >
      Activo refugio por excelencia. Su precio responde sobre todo a los tipos de
      interés reales, la fortaleza del dólar y las compras de los bancos centrales.
  - id: plata
    nombre: "Plata"
    articulo: "la"
    simbolo: XAG
    unidad: "onza troy"
    metalcharts: XAG
    pink_sheet: "Silver"
    cftc: "084691"
    macro: true
    descripcion: >
      Mitad metal precioso, mitad metal industrial (electrónica, paneles solares).
      Suele moverse en la misma dirección que el oro pero con más intensidad.
  - id: platino
    nombre: "Platino"
    simbolo: XPT
    unidad: "onza troy"
    metalcharts: XPT
    pink_sheet: "Platinum"
    cftc: "076651"
    macro: true
    descripcion: >
      Mercado pequeño y muy concentrado (Sudáfrica produce la mayoría). Su demanda
      depende en gran parte de los catalizadores de automóvil y de la joyería.
  - id: paladio
    nombre: "Paladio"
    simbolo: XPD
    unidad: "onza troy"
    metalcharts: XPD
    pink_sheet: null          # el Banco Mundial no publica paladio
    cftc: "075651"
    macro: true
    descripcion: >
      Usado casi en exclusiva en catalizadores de coches de gasolina. Rusia y
      Sudáfrica concentran la producción; es el más volátil de los cuatro.
  - id: cobre
    nombre: "Cobre"
    simbolo: HG
    unidad: "libra"
    metalcharts: HG
    pink_sheet: "Copper"
    pink_sheet_unidad: "tonelada"   # el Banco Mundial lo da en $/tonelada
    cftc: "085692"
    macro: false
    descripcion: >
      Termómetro de la economía mundial: construcción, redes eléctricas y coches
      eléctricos. China consume aproximadamente la mitad del cobre del mundo.

# -----------------------------------------------------------------------------
# Materias primas de APOYO (6-nov-2026). No tienen lectura favorable/desfavorable:
# solo precio, cambios y tendencia, para entender costes y cadenas de precios.
# Cada materia tiene hasta tres ambitos: espana, europa y global. En la web se
# elige cual ver; si el elegido no tiene dato reciente, se muestra el ultimo
# disponible de otro ambito, indicando siempre de donde y de cuando es.
#
# Tipos de fuente:
#   carburantes  Ministerio para la Transicion Ecologica: media de todas las
#                gasolineras de Espana. Se pide cada hora. 'campo' = nombre exacto.
#   boletin      Comision Europea, Weekly Oil Bulletin (semanal). 'columna' = nombre
#                exacto de la columna del Excel (precios con impuestos, EUR/1000 l).
#   mapa         Ministerio de Agricultura, precios medios nacionales (semanal).
#                'producto' = principio del nombre de la fila en su Excel.
#   pink         Banco Mundial, Pink Sheet (mensual). 'serie' = nombre exacto.
#   fred         FRED (necesita FRED_KEY). 'serie' = codigo de la serie.
# 'factor' multiplica el dato original para pasarlo a la unidad mostrada.
# 'historia' (opcional) es otra fuente con la que se completa el pasado.
# -----------------------------------------------------------------------------
apoyo:
  # Antiguedad maxima (dias) para considerar "reciente" un dato segun su frecuencia
  dias_reciente: {horaria: 2, diaria: 10, semanal: 21, mensual: 75}
  grupos:
    - id: energia
      nombre: "Energía"
      descripcion: >
        La energía entra en el coste de casi todo: transporte, maquinaria agrícola,
        fertilizantes y fabricación de materiales.
      materias:
        - id: diesel
          nombre: "Diésel (gasóleo A)"
          ambitos:
            espana:
              fuente: carburantes
              campo: "Precio Gasoleo A"
              unidad: "€/litro"
              decimales: 3
              frecuencia: horaria
              nota: "Media simple de todas las gasolineras de España, impuestos incluidos"
              historia: {fuente: boletin, columna: "ES_price_with_tax_diesel", factor: 0.001}
            europa:
              fuente: boletin
              columna: "EU_price_with_tax_diesel"
              factor: 0.001
              unidad: "€/litro"
              decimales: 3
              frecuencia: semanal
              nota: "Media ponderada de la UE, impuestos incluidos"
            global:
              fuente: fred
              serie: GASDESW
              unidad: "$/galón"
              decimales: 3
              frecuencia: semanal
              etiqueta: "EE. UU."
              nota: "Precio medio en gasolinera en EE. UU. (EIA)"
        - id: brent
          nombre: "Petróleo Brent"
          ambitos:
            global:
              fuente: fred
              serie: DCOILBRENTEU
              unidad: "$/barril"
              frecuencia: diaria
              nota: "Referencia europea del crudo, precio al contado (EIA)"
              historia: {fuente: pink, serie: "Crude oil, Brent"}
        - id: wti
          nombre: "Petróleo WTI"
          ambitos:
            global:
              fuente: fred
              serie: DCOILWTICO
              unidad: "$/barril"
              frecuencia: diaria
              nota: "Referencia estadounidense del crudo, precio al contado (EIA)"
              historia: {fuente: pink, serie: "Crude oil, WTI"}
        - id: gas
          nombre: "Gas natural"
          ambitos:
            # espana: pendiente (MIBGAS, el mercado ibérico; falta confirmar sus condiciones)
            europa:
              fuente: pink
              serie: "Natural gas, Europe"
              unidad: "$/MMBtu"
              frecuencia: mensual
              nota: "Media mensual del mercado europeo (TTF)"
            global:
              fuente: fred
              serie: DHHNGSP
              unidad: "$/MMBtu"
              frecuencia: diaria
              etiqueta: "EE. UU."
              nota: "Henry Hub, referencia estadounidense (EIA)"
              historia: {fuente: pink, serie: "Natural gas, US"}
        - id: carbon
          nombre: "Carbón"
          ambitos:
            global:
              fuente: pink
              serie: "Coal, Australian"
              unidad: "$/tonelada"
              frecuencia: mensual
              nota: "Carbón térmico australiano, referencia de Asia y Europa"

    - id: ganaderia
      nombre: "Ganadería"
      descripcion: >
        El pienso (cereales y soja) y la energía son los mayores costes de la
        ganadería; sus precios suelen trasladarse a la carne con algunos meses de retraso.
      materias:
        - id: cerdo
          nombre: "Cerdo"
          ambitos:
            espana:
              fuente: mapa
              producto: "Porcino >60% magro (S)"
              factor: 0.01
              unidad: "€/kg canal"
              frecuencia: semanal
              nota: "Canal clase S, precio medio nacional"
            # europa: pendiente (el portal agroalimentario de la UE está suspendido)
            global:
              fuente: fred
              serie: PPORKUSDM
              factor: 0.0220462      # de centavos de dólar por libra a dólares por kilo
              unidad: "$/kg"
              frecuencia: mensual
              nota: "Precio de referencia mundial del FMI (canal, EE. UU.)"
        - id: pollo
          nombre: "Pollo"
          ambitos:
            espana:
              fuente: mapa
              producto: "Pollo ("
              factor: 0.01
              unidad: "€/kg canal"
              frecuencia: semanal
              nota: "Canal, precio medio nacional"
            global:
              fuente: pink
              serie: "Chicken **"
              unidad: "$/kg"
              frecuencia: mensual
              nota: "Precio de referencia mundial del Banco Mundial"
        - id: ternera
          nombre: "Ternera"
          ambitos:
            espana:
              fuente: mapa
              producto: "Terneras 180-300 kg"
              factor: 0.01
              unidad: "€/kg canal"
              frecuencia: semanal
              nota: "Terneras de 180 a 300 kg, canal, precio medio nacional"
            global:
              fuente: pink
              serie: "Beef **"
              unidad: "$/kg"
              frecuencia: mensual
              nota: "Vacuno, precio de referencia mundial del Banco Mundial"
        # lacteos: pendiente (precio de la leche cruda en España del FEGA y referencia europea)

# -----------------------------------------------------------------------------
# Presupuesto de consultas a las APIs gratuitas. El motor nunca lo supera.
# -----------------------------------------------------------------------------
presupuesto:
  metalcharts_mensual: 190        # el plan gratuito da 200; dejamos margen
  metalcharts_horas: [8, 11, 14, 17, 20, 23]   # horas (Madrid) en que se piden precios, lunes a viernes
  newsdata_diario: 150            # el plan gratuito da 200 creditos

# -----------------------------------------------------------------------------
# Indicadores (ver pagina de metodologia). Cada uno puntua -1, 0 o +1.
# -----------------------------------------------------------------------------
indicadores:
  tendencia:
    meses_media: 10               # media movil de 10 meses (equivale a ~200 sesiones)
  momento:
    meses: 3
    umbral_pct: 5                 # +1 si sube mas de 5% en 3 meses; -1 si cae mas de 5%
  macro:
    meses: 3                      # compara tipos reales y dolar con hace 3 meses
    umbral_tipo_real: 0.10        # puntos porcentuales para considerar que "baja" o "sube"
    umbral_dolar_pct: 1.0
  posicionamiento:
    anios: 3
    percentil_alto: 90            # por encima: euforia -> -1
    percentil_bajo: 10            # por debajo: pesimismo extremo -> +1
  ratio:
    anios: 10
    desviaciones: 1.0             # cuantas desviaciones tipicas para considerar extremo
  lectura:
    favorable_desde: 2            # suma >= 2 -> favorable
    desfavorable_hasta: -2        # suma <= -2 -> desfavorable

# -----------------------------------------------------------------------------
# Noticias: como se puntua cada titular (0-100) y que se publica.
# -----------------------------------------------------------------------------
noticias:
  umbral_publicacion: 55          # solo se publican las que superan esta nota (6-nov-2026: bajado de 60)
  maximo_portada: 5
  maximo_pagina: 60
  horas_vigencia: 72              # noticias mas antiguas no se muestran
  comercial_requiere_confirmacion: true   # un medio que vende metales no basta por si solo
  nota_medio_desconocido: 50      # nota para medios que llegan via NewsData.io y no estan en la lista
  pesos:
    relevancia: 40
    calidad_medio: 25
    actualidad: 20
    confirmacion: 15
  palabras_clave:
    general: ["materias primas", "commodities", "metales preciosos", "precious metals",
              "bancos centrales", "central bank", "Fed", "BCE", "ECB", "tipos de interés",
              "interest rates", "inflación", "inflation", "dólar", "dollar", "LBMA", "COMEX"]
    oro: ["oro", "gold", "XAU", "bullion", "lingote"]
    plata: ["plata", "silver", "XAG"]
    platino: ["platino", "platinum", "PGM"]
    paladio: ["paladio", "palladium", "PGM"]
    cobre: ["cobre", "copper", "LME"]
  # Para medios que NO estan en la lista de abajo, el titular debe incluir al menos
  # uno de estos terminos de mercado (ademas del metal).
  contexto_mercado: ["precio", "precios", "cotiza", "cotización", "mercado", "mercados", "onza", "futuros",
                     "price", "prices", "market", "markets", "ounce", "futures", "spot", "rally", "record",
                     "demand", "demanda", "supply", "oferta", "central bank", "banco central", "ETF",
                     "Fed", "rate", "rates", "tipos", "inflation", "inflación", "tariff", "aranceles", "mine", "mina"]
  # Webs que generan noticias automaticas sobre compraventas de acciones/ETF concretos
  medios_bloqueados: ["Watch List News", "MarketBeat", "ETF Daily News", "Defense World",
                      "Ticker Report", "The Cerbat Gem", "Modern Readers", "The Lincolnian Online",
                      "Daily Political", "American Banking News", "Stock Observer", "Zolmax"]
  excluir: ["acquires new position", "acquires shares", "position in", "stake in", "shares sold",
            "shares bought", "price target", "holdings in", "sells shares", "buys shares",
            "horóscopo", "lotería", "fútbol", "bitcoin price prediction", "casino",
            "tola", "carat", "quilates", "joyería", "jewellery", "jewelry", "throne", "medalla", "medal"]

