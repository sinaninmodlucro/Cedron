              factor: 0.00092        # de $/tonelada a $/litro
              unidad: "$/litro"
              frecuencia: mensual
              nota: "Precio de referencia mundial (Banco Mundial)"
        - id: patata
          nombre: "Patata"
          ambitos:
            espana:
              fuente: mapa
              producto: "Patata"
              factor: 0.01
