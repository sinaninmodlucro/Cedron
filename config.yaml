              historia: {fuente: percibidos, producto: "MANZANA", empalme: true}
              factor: 0.01
              unidad: "€/kg"
              frecuencia: semanal
              nota: "Precio en origen: manzana Golden, media nacional"
              tienda: {producto: "MANZANA GOLDEN", unidad: "€/kg"}
        - id: cebolla
          nombre: "Cebolla"
          ambitos:
            espana:
              fuente: mapa
              producto: "Cebolla"
              factor: 0.01
              unidad: "€/kg"
              frecuencia: semanal
              nota: "Precio en origen, media nacional"
              tienda: {producto: "CEBOLLAS", unidad: "€/kg"}
        - id: azucar
          nombre: "Azúcar"
          ambitos:
            espana:
              fuente: panel
              producto: "AZUCAR"
              unidad: "€/kg"
              frecuencia: mensual
              nota: "Precio en tienda que pagan los hogares (no hay precio en origen publicado)"
            europa:
              fuente: pink
              serie: "Sugar, EU"
              unidad: "$/kg"
              frecuencia: mensual
