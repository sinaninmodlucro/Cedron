    - {id: preparados_hortalizas, serie: IPC292267, nombre: "Preparados de legumbres y hortalizas", cesta: alimentos}
    - {id: patatas, serie: IPC292375, nombre: "Patatas y sus preparados", cesta: alimentos, materia: patata}
    - {id: cafe_cacao, serie: IPC292275, nombre: "Café, cacao e infusiones", cesta: alimentos}
    - {id: azucar, serie: IPC292271, nombre: "Azúcar", cesta: alimentos, materia: azucar}
    - {id: otros_alimentos, serie: IPC292379, nombre: "Otros preparados alimenticios", cesta: alimentos}
    - {id: bebidas, serie: IPC292279, nombre: "Agua mineral, refrescos y zumos", cesta: alimentos}
    # Energia del hogar y carburantes (subclases)
    - {id: luz, serie: IPC291483, nombre: "Electricidad", cesta: energia, materia: electricidad}
