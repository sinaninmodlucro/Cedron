# -----------------------------------------------------------------------------
# Medidas regulatorias en vigor (11-nov-2026). Se apuntan a mano, con su fuente oficial, las
# medidas que cambian la oferta o el precio de una materia; salen en la ficha de la materia
# hasta la fecha 'hasta'. No entran en el calculo de la prevision (no hay forma de probarlas
# a ciegas: son pocas y cada una distinta), pero hay que leerla sabiendo que existen.
# materia = id de la materia de apoyo; sentido = alza | baja (efecto esperado en el precio).
# -----------------------------------------------------------------------------
medidas:
  - materia: aove
    titulo: "Retirada obligatoria del 12 % del aceite de oliva de la campaña 2026/27"
    texto: >
      El Ministerio de Agricultura obliga a las almazaras a guardar sin vender el 12 % del aceite
      que produzcan (unas 188.000 toneladas) hasta el 30 de septiembre de 2027, porque las
      existencias iniciales más la cosecha prevista superan el 120 % de la media de las seis
      campañas anteriores. El porcentaje puede revisarse a partir del 31 de diciembre de 2026.
      El tope legal es el 20 %. La CNMC advirtió de riesgos para la competencia y los consumidores.
    sentido: alza
    desde: "2026-11-01"
    revision: "2026-12-31"      # desde esta fecha el Ministerio puede revisar el porcentaje
    hasta: "2027-09-30"
    fuente: "Orden APA/1145/2026, de 29 de octubre (BOE), y resolución de la Dirección General de Producciones y Mercados Agrarios"
    enlace: "https://agroinformacion.com/el-ministerio-opta-finalmente-por-establecer-una-retirada-del-12-del-aceite-de-oliva-en-la-campana-2026-2027-188-000-toneladas/"

# -----------------------------------------------------------------------------
# Previsiones de los metales (10-nov-2026, decision del usuario; solo mientras la web sea
# privada). Media a partes iguales de "lo habitual" y de varios calculos sencillos, cada
# uno con una idea (tendencia del ultimo anio, valor frente a hace cinco anios, dolar,
# divisas de paises exportadores, tipos reales y, en oro y plata, su relacion). Cada
# calculo usa solo datos anteriores. Se recalcula una vez al mes. Ver cedron/prevision.py.
# -----------------------------------------------------------------------------
previsiones:
  metales:
    activos: [oro, plata, platino, cobre]   # el paladio no tiene historia larga
    desde: "1976-01"              # como el panel: antes el oro tenia precio fijo
    corte: "2006-01"              # prueba a ciegas: se comprueba desde esta fecha
    plazos: [3, 12]               # meses
    remuestreos: 300
    criba: false                  # true = solo los calculos que van acertando (probado: peor)
  # Riesgo geopolitico (10-nov-2026). Fijado ANTES de probarlo. Idea economica: el riesgo
  # geopolitico MUNDIAL tiende a bajar las materias primas (frena la economia y la demanda);
  # el de los PAISES QUE LAS EXPORTAN tiende a subirlas (miedo a cortes de suministro). Ver
  # BCE, Boletin Economico 8/2023 y 4/2026; Iacoviello y Tong 2026; Verduzco-Bustos y
  # Zanetti 2026. Datos: indice AI-GPR (Iacoviello y Tong), mensual desde 1960.
  #  - indice: un indice ya hecho por los autores (GPR_OIL = sucesos que afectan a la energia;
  #    ACTS_GPR_AI = actos (guerras, ataques), no amenazas, para el oro y la plata como refugio).
  #  - paises: cuota aproximada de las exportaciones mundiales (%, media de la ultima decada,
  #    redondeada; incluye pasos estrechos: Iran-Ormuz, Yemen-mar Rojo, Egipto-Suez). EE. UU.
  #    no entra: su indice mide su papel en los conflictos, no riesgo para su produccion.
  # Cada pais se mide frente a su propia historia: repunte (solo subidas frente a su media del
  # ultimo anio) y nivel frente a los cinco anios anteriores, con un mes de retraso.
  # Mas ideas con historia larga (10-nov-2026, noche). Fijadas ANTES de probarlas: que mide
  # cada una, en que familias tiene sentido economico y como se calcula. Regla de siempre:
  # entra en una familia y plazo solo si sube el numero de previsiones seguras, sube la
  # mediana del R2 fuera de muestra y mejora en al menos la mitad. 'usar' se rellena despues.
  #  - nino: El Nino / La Nina (indice ONI de la NOAA, desde 1950). Cambia lluvias y cosechas
  #    en medio mundo (Brunner 2002; Cashin, Mohaddes y Raissi 2017). Nivel y cambio en tres
  #    meses, con dos meses de retraso (se publica asi).
  #  - actividad: actividad economica mundial (indice de Kilian, Reserva Federal de Dallas,
  #    desde 1968): la demanda mundial es lo que mas mueve energia y metales (Kilian 2009).
  #    Nivel y cambio en tres meses, un mes de retraso.
  #  - inventarios: existencias de crudo y de gas almacenado en EE. UU. (EIA) frente a lo
  #    normal en ese mes del anio (media de los cinco anios anteriores): con almacenes llenos
  #    los precios tienden a bajar (teoria del almacenamiento: Working 1949; Gorton, Hayashi
  #    y Rouwenhorst 2013). Dos meses de retraso.
  #  - comercio: incertidumbre sobre aranceles y politica comercial (indice TPU de Caldara y
  #    otros 2020, noticias de 7 periodicos desde 1960), frente a su media del ultimo anio.
  #  - miedo: volatilidad esperada de la bolsa (VIX, CBOE, desde 1990), frente a su media del
  #    ultimo anio: mide el miedo financiero, para el oro y la plata como refugio (Baur y
  #    Lucey 2010).
  ideas:
    nino: {familias: [agricolas], usar: {}}          # no pasa la regla
    # Resultado (10-nov-2026): entra en industriales a 12 meses (seguras 3 -> 6 de 42, mejora 27)
    actividad: {familias: [energia, industriales], usar: {industriales: [12]}}
    inventarios:
      familias: [energia]
      usar: {}                                      # no pasa la regla
      materias: {petroleo: crudo, diesel: crudo, plasticos: crudo, gas: gas, electricidad: gas}
    # Resultado: entra en agricolas a 12 meses (seguras 3 -> 6 de 28; mejora justo la mitad, 14)
    comercio: {familias: [industriales, agricolas], usar: {agricolas: [12]}}
    # --- Tercera tanda (11-nov-2026), fijada ANTES de probar. Donde se aplica cada idea:
    # 'familias' (por materia), 'abajo_empieza' (eslabones de la cadena cuyo precio de abajo
    # empieza asi), 'ambitos' (materias de apoyo de esos ambitos) o las claves de 'materias'
    # ('grupos' limita a cadena / apoyo / metales). En estas, 'usar' lleva la clave «todo».
    #  - adelantado: indicadores adelantados de la OCDE (G20 y China), hechos para anticipar
    #    la economia 6-9 meses. Nivel frente a 100 de cada uno, dos meses de retraso. Ojo: la
    #    OCDE los revisa hacia atras, asi que la prueba puede salir algo mejor que la realidad.
    #  - inflacion: inflacion esperada por los hogares de EE. UU. a un anio (Universidad de
    #    Michigan, desde 1978): el oro como proteccion. Nivel frente a su media de cinco anios
    #    y cambio en un anio; un mes de retraso.
    #  - sequia: lluvia de los ultimos doce meses en cinco zonas agricolas de Espana (Jaen,
    #    Cordoba, Valladolid, Albacete, Zaragoza; Open-Meteo, reanalisis ERA5 desde 1960)
    #    frente a lo normal (media de los diez anios anteriores). Menos lluvia = peores
    #    cosechas y menos agua en los embalses. En los alimentos de fabrica de Espana y la luz.
    #  - frio: grados-dia de calefaccion de los ultimos tres meses en cinco ciudades europeas
    #    (Londres, Paris, Berlin, Milan, Madrid) frente a lo normal: un invierno frio vacia
    #    los almacenes de gas. En los eslabones de la cadena que parten del gas.
    #  - existencias: existencias mundiales frente al consumo (Departamento de Agricultura de
    #    EE. UU., desde 1960), el dato clasico de los cereales (teoria del almacenamiento).
    #    Solo se publica la cifra ya corregida, no la que se conocia en cada momento: para no
    #    mirar al futuro se usa la campana cerrada hace mas de seis meses (la de dos anios
    #    antes). Nivel frente a las diez campanas anteriores y cambio frente a la anterior.
    #  - mundial: el precio mundial de la misma materia (en euros) en los ultimos 3 y 12
    #    meses, para prever su precio en Espana y Europa (el de fuera llega con retraso).
    # Resultado (11-nov-2026): entra en industriales a 12 meses (seguras 6 -> 9 de 42, mejora 28)
    adelantado: {familias: [energia, industriales], usar: {industriales: [12]}}
    inflacion: {familias: [refugio], usar: {}}   # no pasa la regla
    sequia: {abajo_empieza: ["eurostat:ES|C10", "eurostat:ES|C11", "eurostat:ES|D351"], usar: {}}   # no pasa la regla
    frio: {grupos: [cadena], materias: {gas: x, electricidad: x}, usar: {}}   # no pasa la regla
    existencias:
      materias: {trigo: "Wheat", maiz: "Corn", piensos: "Corn", arroz: "Rice, Milled", cebada: "Barley", soja: "Oilseed, Soybean"}
      usar: {}       # no pasa la regla (con el retraso de seguridad el dato llega demasiado viejo)
    # Resultado: entra a 12 meses (seguras 3 -> 4 de 15, mejora 10)
    mundial: {ambitos: [espana, europa], usar: {todo: [12]}}
    # --- Cuarta tanda (11-nov-2026), fijada ANTES de probar.
    #  - oferta: exceso o falta de oferta mundial. Existencias al empezar la campana + cosecha,
    #    frente a la media de las seis campanas anteriores: es la misma formula con la que el
    #    Ministerio decide retirar aceite de oliva del mercado (Orden APA/1145/2026: se activa
    #    al llegar al 120 %). Datos del Departamento de Agricultura de EE. UU. (suma de todos
    #    los paises). La campana c se usa durante el anio natural c + 1, cuando la cosecha ya
    #    esta recogida; se usa la cifra definitiva, no la estimacion de entonces (suelen
    #    diferir poco frente a los vaivenes de las cosechas, pero favorece algo a la prueba).
    #  - sequia_campo: la misma lluvia de 'sequia', pero en los precios en ORIGEN de Espana de
    #    los cultivos (ahora con historia desde 2005).
    #  - bancos: oro en manos de los bancos centrales del mundo (FMI), cambio en doce meses,
    #    tres meses de retraso. El FMI dejo de publicar esta serie en junio de 2025: solo
    #    sirve para saber si merece la pena buscar otra fuente.
    #  - dinero: dinero en circulacion en EE. UU. (M2, Reserva Federal), crecimiento en doce
    #    meses, dos meses de retraso: mas dinero, mas demanda de oro como reserva de valor.
    oferta:
      materias: {trigo: "Wheat", maiz: "Corn", piensos: "Corn", arroz: "Rice, Milled", cebada: "Barley",
                 soja: "Oilseed, Soybean", girasol: "Oilseed, Sunflowerseed", aove: "Oil, Olive",
                 azucar: "Sugar, Centrifugal", cafe: "Coffee, Green", algodon: "Cotton"}
      usar: {}       # no pasa la regla (mejora 10 de 27 a un anio; algo en aceite de oliva y cebada de Espana)
    sequia_campo:
      ambitos: [espana]
      materias: {aove: x, trigo: x, cebada: x, maiz: x, girasol: x, naranja: x, frutas: x}
      usar: {}       # no pasa la regla
    bancos: {familias: [refugio], usar: {}}          # no pasa la regla
    dinero: {familias: [refugio], usar: {}}          # no pasa la regla
    miedo: {familias: [refugio], usar: {}}           # no pasa la regla
  geopolitica:
    # Resultado de la prueba a ciegas (10-nov-2026, regla fijada antes: sube el numero de
    # previsiones seguras, sube la mediana del R2 y mejora en al menos la mitad): entra en
    # energia a 12 meses (seguras 8 -> 15 de 27) e industriales a 12 meses (2 -> 3 de 42,
    # mejora 24). No entra a 3 meses ni en agricolas ni en oro y plata.
    usar: {energia: [12], industriales: [12]}
    familias:            # se decide por familia y plazo con la misma regla que las demas ideas
      energia: [petroleo, diesel, plasticos, gas, electricidad, carbon]
      agricolas: [trigo, maiz, soja, piensos, girasol, cebada, arroz, azucar, cacao, cafe, algodon, naranja, vacuno, cerdo, pollo]
      industriales: [fertilizantes, aluminio, cobre, acero, zinc, madera, platino]
      refugio: [oro, plata]
    materias:
      petroleo: {indice: GPR_OIL}
      diesel: {indice: GPR_OIL}
      plasticos: {indice: GPR_OIL}
      gas: {paises: {Russia: 35, Norway: 25, Qatar: 12, Algeria: 10, Azerbaijan: 4, Libya: 2, Iran: 5, Egypt: 4}}
