# Precio en tienda (6-nov-2026): Panel de consumo alimentario en hogares del MAPA.
# Mensual, con 2-3 meses de retraso. Se usa el canal 'preferido' (supermercado) y,
# en los meses en que no existe (antes de 2025 se media de otra forma), la media
# de todas las tiendas ('respaldo'), que se mide igual desde 2022.
# Origen y tienda en cualquier materia (ganadería ahora, agrícolas más adelante):
# basta con añadir 'tienda: {producto: "<nombre en el panel>", unidad: "..."}' a su
# ámbito 'espana'. La web muestra entonces los dos precios, el multiplicador del mismo
# mes y el selector «Origen y tienda / En origen / En tienda» (6-nov-2026).
panel:
  canal: "SUPERMERCADO"
  canal_respaldo: "T.ESPAÑA"
  anios_inicial: 2022       # primer ano que se descarga la primera vez

# -----------------------------------------------------------------------------
# Presupuesto de consultas a las APIs gratuitas. El motor nunca lo supera.
# -----------------------------------------------------------------------------
presupuesto:
  metalcharts_mensual: 190        # el plan gratuito da 200; dejamos margen
  metalcharts_horas: [8, 11, 14, 17, 20, 23]   # horas (Madrid) en que se piden precios, lunes a viernes
  newsdata_diario: 150            # el plan gratuito da 200 creditos

# -----------------------------------------------------------------------------
# Indicadores (ver pagina de metodologia). Cada uno puntua -1, 0 o +1.
# -----------------------------------------------------------------------------
indicadores:
  tendencia:
    meses_media: 10               # media movil de 10 meses (equivale a ~200 sesiones)
  momento:
    meses: 3
    umbral_pct: 5                 # +1 si sube mas de 5% en 3 meses; -1 si cae mas de 5%
  macro:
    meses: 3                      # compara tipos reales y dolar con hace 3 meses
    umbral_tipo_real: 0.10        # puntos porcentuales para considerar que "baja" o "sube"
    umbral_dolar_pct: 1.0
  posicionamiento:
    anios: 3
    percentil_alto: 90            # por encima: euforia -> -1
    percentil_bajo: 10            # por debajo: pesimismo extremo -> +1
  ratio:
    anios: 10
    desviaciones: 1.0             # cuantas desviaciones tipicas para considerar extremo
  lectura:
    favorable_desde: 2            # suma >= 2 -> favorable
    desfavorable_hasta: -2        # suma <= -2 -> desfavorable

# -----------------------------------------------------------------------------
# Noticias: como se puntua cada titular (0-100) y que se publica.
# -----------------------------------------------------------------------------
noticias:
  umbral_publicacion: 55          # solo se publican las que superan esta nota (6-nov-2026: bajado de 60)
  maximo_portada: 5
  maximo_pagina: 60
  horas_vigencia: 72              # noticias mas antiguas no se muestran
  comercial_requiere_confirmacion: true   # un medio que vende metales no basta por si solo
  nota_medio_desconocido: 50      # nota para medios que llegan via NewsData.io y no estan en la lista
  pesos:
    relevancia: 40
    calidad_medio: 25
    actualidad: 20
    confirmacion: 15
  palabras_clave:
    general: ["materias primas", "commodities", "metales preciosos", "precious metals",
              "bancos centrales", "central bank", "Fed", "BCE", "ECB", "tipos de interés",
              "interest rates", "inflación", "inflation", "dólar", "dollar", "LBMA", "COMEX"]
    oro: ["oro", "gold", "XAU", "bullion", "lingote"]
    plata: ["plata", "silver", "XAG"]
    platino: ["platino", "platinum", "PGM"]
    paladio: ["paladio", "palladium", "PGM"]
    cobre: ["cobre", "copper", "LME"]
  # Para medios que NO estan en la lista de abajo, el titular debe incluir al menos
  # uno de estos terminos de mercado (ademas del metal).
  contexto_mercado: ["precio", "precios", "cotiza", "cotización", "mercado", "mercados", "onza", "futuros",
                     "price", "prices", "market", "markets", "ounce", "futures", "spot", "rally", "record",
                     "demand", "demanda", "supply", "oferta", "central bank", "banco central", "ETF",
                     "Fed", "rate", "rates", "tipos", "inflation", "inflación", "tariff", "aranceles", "mine", "mina"]
  # Webs que generan noticias automaticas sobre compraventas de acciones/ETF concretos
  medios_bloqueados: ["Watch List News", "MarketBeat", "ETF Daily News", "Defense World",
                      "Ticker Report", "The Cerbat Gem", "Modern Readers", "The Lincolnian Online",
                      "Daily Political", "American Banking News", "Stock Observer", "Zolmax"]
  excluir: ["acquires new position", "acquires shares", "position in", "stake in", "shares sold",
            "shares bought", "price target", "holdings in", "sells shares", "buys shares",
            "horóscopo", "lotería", "fútbol", "bitcoin price prediction", "casino",
            "tola", "carat", "quilates", "joyería", "jewellery", "jewelry", "throne", "medalla", "medal",
            "silver lining"]     # 6-nov-2026: expresion inglesa ("el lado bueno"), no habla de plata

