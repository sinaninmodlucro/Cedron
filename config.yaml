# Futuros (10-nov-2026). Lo que descuenta el mercado de futuros a 3 y 12 meses: el precio
# del contrato que vence en ese plazo frente al del primer contrato. Una vez al dia, de
# Yahoo Finance. SOLO USO PRIVADO: sus condiciones no permiten publicar los datos; si la
# web se abre al publico, poner activo: false. Se apunta en el historial de previsiones
# junto a la nuestra para comparar cual acierta mas. raiz = codigo del contrato; mercado =
# sufijo de Yahoo; meses = letras de los meses con contrato (F ene, G feb, H mar, J abr,
