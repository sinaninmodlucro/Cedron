    plata: ["plata", "silver", "XAG"]
    platino: ["platino", "platinum", "PGM"]
    paladio: ["paladio", "palladium", "PGM"]
    cobre: ["cobre", "copper", "LME"]
    energia: ["petróleo", "crudo", "Brent", "WTI", "OPEP", "OPEC", "diésel", "gasóleo", "gasolina",
              "carburantes", "gas natural", "GNL", "LNG", "electricidad", "precio de la luz", "carbón",
              "oil", "crude", "diesel", "gasoline", "natural gas", "coal", "power prices", "refinery"]
    alimentos: ["fertilizantes", "abonos", "urea", "potasa", "trigo", "maíz", "cereales", "cebada", "soja",
                "arroz", "piensos", "aceite de oliva", "girasol", "porcino", "cerdo", "vacuno", "pollo",
                "huevos", "leche", "lácteos", "azúcar", "cacao", "café", "cosecha", "lonja", "cítricos",
                "fertilizer", "fertilizers", "wheat", "corn", "maize", "grain", "grains", "soybean",
                "soybeans", "rice", "feed", "pork", "hog", "hogs", "cattle", "beef", "poultry", "dairy",
                "sugar", "cocoa", "coffee", "olive oil", "harvest", "crop", "crops"]
    construccion: ["acero", "aluminio", "zinc", "níquel", "mineral de hierro", "chatarra", "cemento",
                   "hormigón", "madera", "materiales de construcción", "steel", "aluminium", "aluminum",
                   "nickel", "iron ore", "scrap", "cement", "lumber", "timber"]
  # Para medios que NO estan en la lista de abajo, el titular debe incluir al menos
  # uno de estos terminos de mercado (ademas del metal).
  contexto_mercado: ["precio", "precios", "cotiza", "cotización", "mercado", "mercados", "onza", "futuros",
