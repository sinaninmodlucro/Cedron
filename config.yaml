    - {id: porcino, serie: IPC292231, nombre: "Carne de porcino", cesta: alimentos, materia: cerdo}
    - {id: ave, serie: IPC292235, nombre: "Carne de ave", cesta: alimentos, materia: pollo}
    - {id: otras_carnes, serie: IPC292239, nombre: "Otras carnes", cesta: alimentos}
    - {id: pescado, serie: IPC292363, nombre: "Pescado fresco y congelado", cesta: alimentos}
    - {id: marisco, serie: IPC292367, nombre: "Crustáceos, moluscos y preparados de pescado", cesta: alimentos}
    - {id: huevos, serie: IPC292243, nombre: "Huevos", cesta: alimentos, materia: huevos}
    - {id: leche, serie: IPC292247, nombre: "Leche", cesta: alimentos, materia: leche}
    - {id: lacteos, serie: IPC292251, nombre: "Productos lácteos", cesta: alimentos}
    - {id: aceites, serie: IPC292255, nombre: "Aceites y grasas", cesta: alimentos}
    - {id: frutas, serie: IPC292259, nombre: "Frutas frescas", cesta: alimentos}
    - {id: frutas_conserva, serie: IPC292371, nombre: "Frutas en conserva y frutos secos", cesta: alimentos}
