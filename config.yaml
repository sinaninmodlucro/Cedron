      cafe: {paises: {Brazil: 35, Vietnam: 17, Colombia: 10, Indonesia: 6, Ethiopia: 4, Honduras: 4}}
      algodon: {paises: {Brazil: 25, India: 8, Australia: 8, Benin: 3, Burkina Faso: 2}}
      naranja: {paises: {Brazil: 70, Mexico: 5}}
      vacuno: {paises: {Brazil: 25, Australia: 15, Argentina: 8, Uruguay: 4}}
      cerdo: {paises: {Germany: 10, Denmark: 8, Brazil: 10, Canada: 10, Netherlands: 6}}
      pollo: {paises: {Brazil: 35, Thailand: 8, Ukraine: 5, Netherlands: 5, Poland: 6}}
      fertilizantes: {paises: {Russia: 18, China: 12, Canada: 15, Belarus: 10, Morocco: 8, Qatar: 5, Saudi Arabia: 5, Egypt: 4, Oman: 3}}
      aluminio: {paises: {Guinea: 15, Canada: 12, Russia: 10, China: 10, India: 6, UAE: 6, Australia: 5, Bahrain: 3}}
      cobre: {paises: {Chile: 30, Peru: 12, DRC: 10, China: 8, Zambia: 5, Indonesia: 4, Russia: 4}}
      acero: {paises: {Australia: 40, Brazil: 18, China: 15, Russia: 6, India: 5, Turkey: 4, South Africa: 4, Ukraine: 3}}
      zinc: {paises: {Indonesia: 25, Australia: 10, Peru: 10, Russia: 10, China: 10, Philippines: 8, Myanmar: 5, Bolivia: 5}}
      madera: {paises: {Canada: 20, Russia: 15, Sweden: 8, Finland: 8, Germany: 6}}
      platino: {paises: {South Africa: 70, Russia: 12, Zimbabwe: 8}}
      oro: {indice: ACTS_GPR_AI}
      plata: {indice: ACTS_GPR_AI}
  # Materias primas de apoyo (10-nov-2026): cada ambito con historia suficiente. Mismos
  # calculos que los metales salvo los tipos reales, mas la inercia de tres meses y la
  # temporada; el dolar y las divisas solo en los precios mundiales.
  apoyo:
    plazos: [3, 12]
    minimo_meses: 120             # diez anios de datos mensuales como minimo
    remuestreos: 300

