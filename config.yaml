# =============================================================================
# Estado de las fuentes (11-nov-2026). Pagina «Estado»: de cada fuente, cuando llego su
# ultimo dato y si va con retraso. 'max_dias' = cuantos dias puede tener el dato mas nuevo
# (contados desde el final del periodo al que se refiere: un dato de septiembre cuenta
# desde el 30 de septiembre) antes de marcarse «con retraso». Se fijaron segun lo que
# tarda cada organismo en publicar. 'modo': series (dentro de "series"), lista (lista de
# fechas), cot (posiciones de la CFTC), consultado (hora de la ultima descarga) o noticias.
# 'estado' es el nombre con que el motor anota los fallos de esa fuente.
# =============================================================================
estado_fuentes:
  - {nombre: "Precios de los metales (MetalCharts)", estado: "MetalCharts", archivo: apoyo/metalcharts.json, max_dias: 4, frecuencia: "6 veces por día laborable"}
  - {nombre: "Histórico mensual (Banco Mundial)", estado: "Banco Mundial", archivo: pink.json, max_dias: 45, frecuencia: "mensual"}
  - {nombre: "Tipos de interés y dólar (FRED)", estado: "FRED", archivo: macro.json, max_dias: 8, frecuencia: "diaria"}
  - {nombre: "Euro/dólar (BCE)", estado: "BCE (tipo de cambio)", archivo: cambio.json, max_dias: 5, frecuencia: "diaria (laborables)"}
  - {nombre: "Posicionamiento (CFTC)", estado: "CFTC", archivo: cot.json, modo: cot, max_dias: 14, frecuencia: "semanal"}
  - {nombre: "Energía y otros (FRED)", estado: "FRED (materias de apoyo)", archivo: apoyo/fred.json, max_dias: 12, frecuencia: "diaria"}
  - {nombre: "Diésel y carburantes (Oil Bulletin)", estado: "Comisión Europea (Oil Bulletin)", archivo: apoyo/boletin.json, max_dias: 16, frecuencia: "semanal"}
  - {nombre: "Precios en origen semanales (MAPA)", estado: "MAPA (precios semanales)", archivo: apoyo/mapa.json, max_dias: 30, frecuencia: "semanal"}
  - {nombre: "Precios en tienda (MAPA, panel de consumo)", estado: "MAPA (panel de consumo)", archivo: apoyo/panel.json, max_dias: 125, frecuencia: "mensual, 2-3 meses de retraso"}
  - {nombre: "Fertilizantes (MAPA, precios pagados)", estado: "MAPA (precios pagados)", archivo: apoyo/pagados.json, max_dias: 150, frecuencia: "mensual, unos 3 meses de retraso"}
  - {nombre: "Precios en origen mensuales (MAPA, percibidos)", estado: "MAPA (precios percibidos)", archivo: apoyo/percibidos.json, max_dias: 150, frecuencia: "mensual, unos 3 meses de retraso"}
  - {nombre: "Precios de fábrica (Eurostat)", estado: "Eurostat (precios industriales)", archivo: apoyo/eurostat.json, max_dias: 80, frecuencia: "mensual, 1-2 meses de retraso"}
  - {nombre: "Cadena de costes (Eurostat)", estado: "Eurostat (cadena de costes)", archivo: cadena/eurostat.json, max_dias: 80, frecuencia: "se descarga una vez al mes"}
  - {nombre: "Electricidad en España (Red Eléctrica)", estado: "Red Eléctrica (electricidad)", archivo: apoyo/ree.json, max_dias: 3, frecuencia: "diaria"}
  - {nombre: "Gas en España (MIBGAS)", estado: "MIBGAS (gas)", archivo: apoyo/mibgas.json, max_dias: 5, frecuencia: "diaria"}
  - {nombre: "IPC por producto (INE)", estado: "INE (IPC)", archivo: ipc.json, max_dias: 50, frecuencia: "mensual, hacia mediados del mes siguiente"}
  - {nombre: "Futuros (Yahoo Finance)", estado: "Futuros (Yahoo Finance)", archivo: futuros.json, modo: consultado, max_dias: 4, frecuencia: "diaria"}
  - {nombre: "Noticias", estado: "NewsData.io", archivo: noticias.json, modo: noticias, max_dias: 1, frecuencia: "cada hora"}

# =============================================================================
# «Qué ha cambiado» y resumen semanal por correo (11-nov-2026).
# El motor apunta en data/novedades.json cada dato nuevo que llega y cada cambio de
# tendencia (al alza, mixta, a la baja: la misma regla que los metales, precio frente a su
# media de hace 1, 3 y 12 meses). La portada muestra lo de ayer y la ultima semana.
# El resumen semanal se envia como incidencia de GitHub (llega por correo) el dia y la
# hora indicados (hora de Madrid). El repositorio es publico: el resumen solo lleva datos
# de mercado, nada personal.
# =============================================================================
novedades:
  dias_registro: 60          # dias de cambios que se guardan
  maximo_movimientos: 6      # subidas y bajadas que se muestran de cada lado
  movimiento_minimo_pct: 1.0 # por debajo de este cambio no se considera «movimiento»
  # «Por qué se movió»: un salto es fuerte si el cambio entre dos datos seguidos supera
  # este numero de veces la desviacion tipica de los cambios del ultimo anio de esa serie
  salto_veces: 2.5
  correo:
    activo: true
    dia: 0                   # 0 = lunes ... 6 = domingo
    hora: 8                  # desde esta hora (Madrid); la primera ejecucion que toque lo envia

# =============================================================================
# IPC del INE por producto (11-nov-2026). Lo que sube en la tienda segun el dato oficial,
# junto al precio en origen de cada materia, y la base de «La cesta». Indices mensuales
# base 2025 (ECOICOP v2) desde 2002; publicacion hacia mediados del mes siguiente.
# Reutilizacion libre citando al INE.
#   serie: codigo de la serie del indice en el INE (servicios.ine.es/wstempus)
#   materia: id de la materia de apoyo en cuya ficha se muestra (opcional)
#   cesta: alimentos | energia (entra en «La cesta» con la ponderacion oficial del INE);
#          sin 'cesta', solo se muestra en la ficha de la materia
#   peso_nombre: nombre con que el INE publica su ponderacion, si no coincide con 'nombre'
# Las ponderaciones (por mil del gasto de los hogares) se descargan de las tablas indicadas
# una vez al mes. Si el INE no publica la de una serie (p. ej. gas natural, por secreto
# estadistico), esa serie no entra en la cesta: no se inventa.
# =============================================================================
ipc:
  general: IPC290751
  tablas_pesos: [76159, 76160, 76161]   # subclases, rubricas y grupos especiales
  series:
    # Alimentos (rubricas del INE: no se solapan entre si)
    - {id: cereales, serie: IPC292215, nombre: "Cereales y derivados", cesta: alimentos, materia: arroz}
