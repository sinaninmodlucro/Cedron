# -----------------------------------------------------------------------------
# Prueba historica (pagina de metodologia). Aplica las reglas de arriba, mes a
# mes, a los ultimos anios del Banco Mundial y mira que paso despues con el
# precio. Se repite sola una vez al mes. Anadida el 6-nov-2026.
# -----------------------------------------------------------------------------
prueba_historica:
  anios: 50                       # 15 al principio; 50 desde el 6-nov-2026 (mas ciclos de mercado)
  horizontes: [3, 6, 12]          # meses despues de cada senal en que se mira el precio
  salto_meses: 1                  # un mes entre senal y medicion: quita la inercia falsa de las medias mensuales
  corte: "2006-01"                # prueba a ciegas: antes = periodo de eleccion, despues = comprobacion
  remuestreos: 500                # para el margen de error
  confianza: 95                   # % del margen de error; con 90 % habia un 11 % de "aciertos" por casualidad
  # Reglas candidatas: se prueban igual que las actuales pero NO se usan en la web.
  # Sirven para decidir cambios con datos. "indicadores" cambia parametros;
  # "quitar" saca indicadores de la suma (lista para todos o por metal).
  candidatas:
    momento_12:
      texto: "Momento: cambio frente a hace 12 meses (subida o bajada, sin umbral)"
      indicadores: {momento: {meses: 12, umbral_pct: 0}}
    sin_posicionamiento:
      texto: "Sin posicionamiento en la suma"
      quitar: [posicionamiento]
    sin_ratio_platino:
      texto: "Sin valoración relativa en la suma del platino"
      quitar: {platino: [ratio]}
    conjunto:
      texto: "Momento a 12 meses, sin posicionamiento y sin ratio en el platino"
      indicadores: {momento: {meses: 12, umbral_pct: 0}}
      quitar: {oro: [posicionamiento], plata: [posicionamiento], platino: [posicionamiento, ratio], cobre: [posicionamiento], paladio: [posicionamiento]}
  # Metodo en estudio (6-nov-2026). Reglas y parametros fijados ANTES de probarlos,
  # sacados de los estudios (no ajustados a nuestros datos). No se usa en la web
  # hasta que el usuario lo decida.
  metodo_nuevo:
    texto: "Tendencia en varios plazos + valor a cinco años (+ ratio oro/plata en oro y plata; + actividad industrial en el cobre)"
    horizonte: 12                 # probabilidad de que el precio suba en 12 meses
    previa: 12                    # con pocos casos de una situacion, la probabilidad se acerca a la general (12 casos ficticios)
    minimo_casos: 60              # meses con resultado conocido antes de empezar a dar probabilidades
    min_indicadores: 2
    indicadores:
      oro: [tendencia_plazos, valor, ratio]
      plata: [tendencia_plazos, valor, ratio]
      platino: [tendencia_plazos, valor]
      cobre: [tendencia_plazos, valor, actividad]
      paladio: [tendencia_plazos, valor]
    parametros:
      tendencia_plazos: {plazos: [1, 3, 12]}          # Hurst, Ooi y Pedersen (2017)
      valor: {anios: 5, ventana_meses: 12, historia_anios: 20, desviaciones: 1.0}   # Asness, Moskowitz y Pedersen (2013)
      actividad: {meses: 12, umbral_puntos: 1.0, retraso_meses: 1}   # FRED CAPUTLG331S; respaldo mas debil (un estudio de 2025)

# -----------------------------------------------------------------------------
# Noticias: como se puntua cada titular (0-100) y que se publica.
# -----------------------------------------------------------------------------
noticias:
  umbral_publicacion: 55          # solo se publican las que superan esta nota (6-nov-2026: bajado de 60)
  maximo_portada: 5
  maximo_pagina: 250              # 60 hasta el 10-nov-2026
  horas_vigencia: 48              # noticias mas antiguas no se muestran (72 hasta el 10-nov-2026)
  horas_portada: 12               # la portada elige las mejores de las ultimas horas (10-nov-2026)
  archivo: true                   # guarda cada noticia publicada en data/noticias_archivo/AAAA-MM.json (10-nov-2026)
  # Consultas a NewsData.io en cada ejecucion (maximo 100 caracteres cada una; 4 x 24 h = 96
  # creditos al dia, por debajo del tope de presupuesto.newsdata_diario). 10-nov-2026.
  consultas_newsdata:
    - "gold OR silver OR copper OR platinum OR palladium OR oro OR plata OR cobre"
    - "oil OR Brent OR \"natural gas\" OR diesel OR petróleo OR gasolina OR electricidad"
    - "wheat OR corn OR fertilizer OR soybean OR trigo OR maíz OR fertilizantes OR piensos"
    - "steel OR aluminium OR \"iron ore\" OR cement OR acero OR aluminio OR cemento"
  # Temas (10-nov-2026): ademas de los metales, cada noticia se etiqueta con los temas de
  # la cadena de costes (mismos identificadores que cadena.cadenas). Sus palabras estan
  # en palabras_clave, mas abajo.
  temas:
    energia: "Energía"
    alimentos: "Abonos y alimentos"
    construccion: "Construcción"
  comercial_requiere_confirmacion: true   # un medio que vende metales no basta por si solo
  nota_medio_desconocido: 50      # nota para medios que llegan via NewsData.io y no estan en la lista
  pesos:
    relevancia: 40
    calidad_medio: 25
    actualidad: 20
    confirmacion: 15
  palabras_clave:
    general: ["materias primas", "commodities", "metales preciosos", "precious metals",
              "bancos centrales", "central bank", "Fed", "BCE", "ECB", "tipos de interés",
              "interest rates", "inflación", "inflation", "dólar", "dollar", "LBMA", "COMEX"]
