# Precio en tienda (6-nov-2026): Panel de consumo alimentario en hogares del MAPA.
# Mensual, con 2-3 meses de retraso. Se usa el canal 'preferido' (supermercado) y,
# en los meses en que no existe (antes de 2025 se media de otra forma), la media
# de todas las tiendas ('respaldo'), que se mide igual desde 2022.
# Origen y tienda en cualquier materia (ganadería ahora, agrícolas más adelante):
# basta con añadir 'tienda: {producto: "<nombre en el panel>", unidad: "..."}' a su
# ámbito 'espana'. La web muestra entonces los dos precios, el multiplicador del mismo
# mes y el selector «Origen y tienda / En origen / En tienda» (6-nov-2026).
panel:
  canal: "SUPERMERCADO"
  canal_respaldo: "T.ESPAÑA"
  anios_inicial: 2022       # primer ano que se descarga la primera vez

# -----------------------------------------------------------------------------
# Presupuesto de consultas a las APIs gratuitas. El motor nunca lo supera.
# -----------------------------------------------------------------------------
presupuesto:
  metalcharts_mensual: 190        # el plan gratuito da 200; dejamos margen
  metalcharts_horas: [8, 11, 14, 17, 20, 23]   # horas (Madrid) en que se piden precios, lunes a viernes
  newsdata_diario: 150            # el plan gratuito da 200 creditos

# -----------------------------------------------------------------------------
# Indicadores (ver pagina de metodologia). Cada uno puntua -1, 0 o +1.
# -----------------------------------------------------------------------------
indicadores:
  # Panel de cada metal (desde el 6-nov-2026, decision del usuario tras la prueba
  # historica): la tendencia en varios plazos es lo principal; el resto es contexto
  # y ya no suma en ninguna lectura.
  tendencia_plazos:
    plazos: [1, 3, 12]            # meses; Hurst, Ooi y Pedersen (2017)
  tendencia:
    meses_media: 10               # media movil de 10 meses (equivale a ~200 sesiones)
  momento:
    meses: 3
    umbral_pct: 5                 # +1 si sube mas de 5% en 3 meses; -1 si cae mas de 5%
  macro:
    meses: 3                      # compara tipos reales y dolar con hace 3 meses
    umbral_tipo_real: 0.10        # puntos porcentuales para considerar que "baja" o "sube"
    umbral_dolar_pct: 1.0
  posicionamiento:
    anios: 3
    percentil_alto: 90            # por encima: euforia -> -1
    percentil_bajo: 10            # por debajo: pesimismo extremo -> +1
  ratio:
    anios: 10
    desviaciones: 1.0             # cuantas desviaciones tipicas para considerar extremo
  lectura:
    favorable_desde: 2            # suma >= 2 -> favorable
    desfavorable_hasta: -2        # suma <= -2 -> desfavorable

# -----------------------------------------------------------------------------
# Cadena de costes (pagina «Cadena de costes»; cedron/cadena.py). Anadida el
# 6-nov-2026, decidida con el usuario: se muestran solo los eslabones que se
# comprueban con datos (los demas, en gris), el traslado pendiente solo si acierta
# en la prueba a ciegas, y subidas frente a bajadas solo si la diferencia es clara.
# Cada eslabon: serie de arriba y de abajo ("origen:nombre"; origen = pink, pagados,
# boletin, eurostat o fred), si se pasa a euros, y desde cuando se mide.
# Se recalcula una vez al mes.
# -----------------------------------------------------------------------------
cadena:
  remuestreos: 300
  eurostat_desde: "2000-01"       # la cadena baja sus propias series de Eurostat, con toda la historia
  cadenas:
    - id: energia
      nombre: "Energía"
      eslabones:
        - id: brent_diesel
          arriba: {serie: "pink:Crude oil, Brent", nombre: "Petróleo Brent (en euros)", corto: "el petróleo", en_euros: true}
          abajo: {serie: "boletin:ES_price_with_tax_diesel", nombre: "Diésel en España (con impuestos)", corto: "el diésel"}
          desde: "2005-01"
          fuentes: "Banco Mundial; Comisión Europea (Weekly Oil Bulletin); BCE"
          nota: "Los impuestos fijos por litro hacen que el diésel suba en porcentaje menos que el petróleo."
        - id: brent_gasolina
          arriba: {serie: "pink:Crude oil, Brent", nombre: "Petróleo Brent (en euros)", corto: "el petróleo", en_euros: true}
          abajo: {serie: "boletin:ES_price_with_tax_euro95", nombre: "Gasolina 95 en España (con impuestos)", corto: "la gasolina"}
          desde: "2005-01"
          fuentes: "Banco Mundial; Comisión Europea (Weekly Oil Bulletin); BCE"
        - id: brent_calefaccion
          arriba: {serie: "pink:Crude oil, Brent", nombre: "Petróleo Brent (en euros)", corto: "el petróleo", en_euros: true}
          abajo: {serie: "boletin:ES_price_with_tax_heating_oil", nombre: "Gasóleo de calefacción en España (con impuestos)", corto: "el gasóleo de calefacción"}
          desde: "2005-01"
          fuentes: "Banco Mundial; Comisión Europea (Weekly Oil Bulletin); BCE"
        - id: brent_refino
          arriba: {serie: "pink:Crude oil, Brent", nombre: "Petróleo Brent (en euros)", corto: "el petróleo", en_euros: true}
          abajo: {serie: "eurostat:ES|C192", nombre: "Carburantes al salir de la refinería en España", corto: "los carburantes de refinería"}
          desde: "2005-01"
          fuentes: "Banco Mundial; Eurostat; BCE"
          nota: "Precio al salir de la refinería, antes de impuestos y de la distribución."
        - id: brent_gas
          arriba: {serie: "pink:Crude oil, Brent", nombre: "Petróleo Brent", corto: "el petróleo"}
          abajo: {serie: "pink:Natural gas, Europe", nombre: "Gas natural en Europa", corto: "el gas"}
          desde: "1990-01"
          fuentes: "Banco Mundial"
          nota: "Durante años, muchos contratos de gas en Europa se fijaban según el precio del petróleo."
        - id: gas_electricidad
          arriba: {serie: "pink:Natural gas, Europe", nombre: "Gas natural en Europa (en euros)", corto: "el gas", en_euros: true}
          abajo: {serie: "eurostat:ES|D351", nombre: "Electricidad (precio de producción) en España", corto: "la electricidad"}
          desde: "2005-01"
          fuentes: "Banco Mundial; Eurostat; BCE"
          nota: "Las centrales de gas suelen marcar el precio de la electricidad en las horas caras."
        - id: carbon_electricidad
          arriba: {serie: "pink:Coal, Australian", nombre: "Carbón (en euros)", corto: "el carbón", en_euros: true}
          abajo: {serie: "eurostat:ES|D351", nombre: "Electricidad (precio de producción) en España", corto: "la electricidad"}
          desde: "2005-01"
          fuentes: "Banco Mundial; Eurostat; BCE"
        - id: gas_gas_es
          arriba: {serie: "pink:Natural gas, Europe", nombre: "Gas natural en Europa (en euros)", corto: "el gas", en_euros: true}
          abajo: {serie: "eurostat:ES|D352", nombre: "Gas distribuido en España", corto: "el gas distribuido"}
          desde: "2005-01"
          fuentes: "Banco Mundial; Eurostat; BCE"
        - id: brent_urea
          arriba: {serie: "pink:Crude oil, Brent", nombre: "Petróleo Brent", corto: "el petróleo"}
