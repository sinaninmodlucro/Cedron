# =============================================================================
# CEDRON - Configuracion general
# Este es el UNICO archivo que hace falta tocar para ajustar el comportamiento
# de la web. Cada parametro lleva una explicacion. Tras cambiarlo, la siguiente
# actualizacion automatica (cada hora) ya lo aplica.
# =============================================================================

sitio:
  nombre: "Cedron"
  lema: "Análisis independiente de metales preciosos y materias primas"
  url: "https://cedron.example"        # cambiar cuando tengamos dominio
  autor: "Equipo Cedron"               # quien firma los analisis (exigido por MAR)
  contacto: "contacto@cedron.example"
  idioma: "es"
  zona_horaria: "Europe/Madrid"

# -----------------------------------------------------------------------------
# Activos cubiertos. 'pink_sheet' es el nombre exacto de la serie en el Banco
# Mundial (historico mensual, licencia CC BY 4.0). 'metalcharts' es el simbolo
# para el precio actual. 'cftc' es el codigo de contrato de la CFTC.
# -----------------------------------------------------------------------------
activos:
  - id: oro
    nombre: "Oro"
    simbolo: XAU
    unidad: "onza troy"
    metalcharts: XAU
    pink_sheet: "Gold"
    cftc: "088691"
    macro: true
    descripcion: >
      Activo refugio por excelencia. Su precio responde sobre todo a los tipos de
      interés reales, la fortaleza del dólar y las compras de los bancos centrales.
  - id: plata
    nombre: "Plata"
    articulo: "la"
    simbolo: XAG
    unidad: "onza troy"
    metalcharts: XAG
    pink_sheet: "Silver"
    cftc: "084691"
    macro: true
    descripcion: >
      Mitad metal precioso, mitad metal industrial (electrónica, paneles solares).
      Suele moverse en la misma dirección que el oro pero con más intensidad.
  - id: platino
    nombre: "Platino"
    simbolo: XPT
    unidad: "onza troy"
    metalcharts: XPT
    pink_sheet: "Platinum"
    cftc: "076651"
    macro: true
    descripcion: >
      Mercado pequeño y muy concentrado (Sudáfrica produce la mayoría). Su demanda
      depende en gran parte de los catalizadores de automóvil y de la joyería.
  - id: paladio
    nombre: "Paladio"
    simbolo: XPD
    unidad: "onza troy"
    metalcharts: XPD
    pink_sheet: null          # el Banco Mundial no publica paladio
    cftc: "075651"
    macro: true
    descripcion: >
      Usado casi en exclusiva en catalizadores de coches de gasolina. Rusia y
      Sudáfrica concentran la producción; es el más volátil de los cuatro.
  - id: cobre
    nombre: "Cobre"
    simbolo: HG
    unidad: "libra"
    metalcharts: HG
    pink_sheet: "Copper"
    pink_sheet_unidad: "tonelada"   # el Banco Mundial lo da en $/tonelada
    cftc: "085692"
    macro: false
    descripcion: >
      Termómetro de la economía mundial: construcción, redes eléctricas y coches
      eléctricos. China consume aproximadamente la mitad del cobre del mundo.

# -----------------------------------------------------------------------------
# Materias primas de APOYO (6-nov-2026). No tienen lectura favorable/desfavorable:
# solo precio, cambios y tendencia, para entender costes y cadenas de precios.
# Cada materia tiene hasta tres ambitos: espana, europa y global. En la web se
# elige cual ver; si el elegido no tiene dato reciente, se muestra el ultimo
# disponible de otro ambito, indicando siempre de donde y de cuando es.
#
# Tipos de fuente:
#   carburantes  Ministerio para la Transicion Ecologica: media de todas las
#                gasolineras de Espana. Se pide cada hora. 'campo' = nombre exacto.
#   boletin      Comision Europea, Weekly Oil Bulletin (semanal). 'columna' = nombre
#                exacto de la columna del Excel (precios con impuestos, EUR/1000 l).
#   mapa         Ministerio de Agricultura, precios medios nacionales (semanal).
#                'producto' = principio del nombre de la fila en su Excel.
#   pink         Banco Mundial, Pink Sheet (mensual). 'serie' = nombre exacto.
#   fred         FRED (necesita FRED_KEY). 'serie' = codigo de la serie.
#   panel        Ministerio de Agricultura, panel de consumo en hogares (mensual):
#                precio en tienda. 'producto' = nombre exacto de la fila; si el
#                nombre se repite, 'PADRE>HIJO' (p. ej. "ARROZ>NORMAL").
#   pagados      Ministerio de Agricultura, precios pagados por los agricultores
#                (mensual, EUR/100 kg sin IVA). 'producto' = principio del nombre.
#   eurostat     Eurostat, indices de precios industriales (mensual, 2021 = 100).
#                'serie' = "territorio|actividad NACE", p. ej. "ES|C2442" (aluminio).
# 'factor' multiplica el dato original para pasarlo a la unidad mostrada.
# 'dias_reciente' en un ambito cambia la antiguedad maxima para esa fuente
# (las estadisticas oficiales mensuales salen con 2-4 meses de retraso).
# 'historia' (opcional) es otra fuente con la que se completa el pasado.
# -----------------------------------------------------------------------------
apoyo:
  # Antiguedad maxima (dias) para considerar "reciente" un dato segun su frecuencia
  dias_reciente: {horaria: 2, diaria: 10, semanal: 21, mensual: 75}
  grupos:
    - id: energia
      nombre: "Energía"
      descripcion: >
        La energía entra en el coste de casi todo: transporte, maquinaria agrícola,
        fertilizantes y fabricación de materiales.
      materias:
        - id: diesel
          nombre: "Diésel (gasóleo A)"
          ambitos:
            # 6-nov-2026: el Ministerio de Transición Ecológica (media horaria de las
            # gasolineras) corta las conexiones desde GitHub; por decisión del usuario se
            # sustituye por el boletín semanal de la Comisión Europea para España.
            espana:
              fuente: boletin
              columna: "ES_price_with_tax_diesel"
              factor: 0.001
              unidad: "€/litro"
              decimales: 3
              frecuencia: semanal
              nota: "Precio medio en España, impuestos incluidos (boletín semanal de la Comisión Europea)"
            europa:
              fuente: boletin
              columna: "EU_price_with_tax_diesel"
              factor: 0.001
              unidad: "€/litro"
              decimales: 3
              frecuencia: semanal
              nota: "Media ponderada de la UE, impuestos incluidos"
            global:
              fuente: fred
              serie: GASDESW
              unidad: "$/galón"
              decimales: 3
              frecuencia: semanal
              etiqueta: "EE. UU."
              nota: "Precio medio en gasolinera en EE. UU. (EIA)"
        - id: brent
          nombre: "Petróleo Brent"
          ambitos:
            global:
              fuente: fred
              serie: DCOILBRENTEU
              unidad: "$/barril"
              frecuencia: diaria
              nota: "Referencia europea del crudo, precio al contado (EIA)"
              historia: {fuente: pink, serie: "Crude oil, Brent"}
        - id: wti
          nombre: "Petróleo WTI"
          ambitos:
            global:
              fuente: fred
              serie: DCOILWTICO
              unidad: "$/barril"
              frecuencia: diaria
              nota: "Referencia estadounidense del crudo, precio al contado (EIA)"
              historia: {fuente: pink, serie: "Crude oil, WTI"}
        - id: gas
          nombre: "Gas natural"
          ambitos:
            # espana: pendiente (MIBGAS, el mercado ibérico; falta confirmar sus condiciones)
            europa:
              fuente: pink
              serie: "Natural gas, Europe"
              unidad: "$/MMBtu"
              frecuencia: mensual
              nota: "Media mensual del mercado europeo (TTF)"
            global:
              fuente: fred
              serie: DHHNGSP
              unidad: "$/MMBtu"
              frecuencia: diaria
              etiqueta: "EE. UU."
              nota: "Henry Hub, referencia estadounidense (EIA)"
              historia: {fuente: pink, serie: "Natural gas, US"}
        - id: carbon
          nombre: "Carbón"
          ambitos:
            global:
              fuente: pink
              serie: "Coal, Australian"
              unidad: "$/tonelada"
              frecuencia: mensual
              nota: "Carbón térmico australiano, referencia de Asia y Europa"

    - id: ganaderia
      nombre: "Ganadería, huevos y leche"
      pestana: "Ganadería"        # nombre corto de su pestaña en la web
      descripcion: >
        El pienso (cereales y soja) y la energía son los mayores costes de la
        ganadería; sus precios suelen trasladarse a la carne con algunos meses de retraso.
        En España se ve el precio en origen y el que se paga en el supermercado.
      materias:
        - id: cerdo
          nombre: "Cerdo"
          ambitos:
            espana:
              fuente: mapa
              producto: "Porcino >60% magro (S)"
              factor: 0.01
              unidad: "€/kg canal"
              frecuencia: semanal
              nota: "Precio en origen (lo que cobra el ganadero): canal clase S, media nacional"
              tienda: {producto: "CARNE CERDO", unidad: "€/kg"}
            # europa: pendiente (el portal agroalimentario de la UE está suspendido)
            global:
              fuente: fred
              serie: PPORKUSDM
              factor: 0.0220462      # de centavos de dólar por libra a dólares por kilo
              unidad: "$/kg"
              frecuencia: mensual
              nota: "Precio de referencia mundial del FMI (canal, EE. UU.)"
        - id: pollo
          nombre: "Pollo"
          ambitos:
            espana:
              fuente: mapa
              producto: "Pollo ("
              factor: 0.01
              unidad: "€/kg canal"
              frecuencia: semanal
              nota: "Precio en origen (lo que cobra el ganadero): canal, media nacional"
              tienda: {producto: "CARNE POLLO", unidad: "€/kg"}
            global:
              fuente: pink
              serie: "Chicken **"
              unidad: "$/kg"
              frecuencia: mensual
              nota: "Precio de referencia mundial del Banco Mundial"
        - id: ternera
          nombre: "Ternera"
          ambitos:
            espana:
              fuente: mapa
              producto: "Terneras 180-300 kg"
              factor: 0.01
              unidad: "€/kg canal"
              frecuencia: semanal
              nota: "Precio en origen (lo que cobra el ganadero): terneras de 180 a 300 kg, canal, media nacional"
              tienda: {producto: "CARNE VACUNO", unidad: "€/kg"}
            global:
              fuente: pink
              serie: "Beef **"
              unidad: "$/kg"
              frecuencia: mensual
              nota: "Vacuno, precio de referencia mundial del Banco Mundial"
        - id: huevos
          nombre: "Huevos"
          ambitos:
            espana:
              fuente: mapa
              producto: "Huevos tipo jaula acondicionada - Clase M"
              factor: 0.0833333      # de euros por docena a euros por huevo
              unidad: "€/unidad"
              decimales: 3
              frecuencia: semanal
              nota: "Precio en origen (lo que cobra el productor): huevo de jaula, clase M, media nacional"
              tienda: {producto: "T.HUEVOS UNDS.", unidad: "€/unidad", decimales: 3}
        - id: leche
          nombre: "Leche"
          ambitos:
            espana:
              fuente: panel
              producto: "TOTAL LECHE LIQUIDA"
              unidad: "€/litro"
              frecuencia: mensual
              nota: "Precio en supermercado que pagan los hogares (toda la leche líquida)"
            # origen: pendiente (precio de la leche cruda al ganadero, FEGA); europa: pendiente

    # Bloque 2 (6-nov-2026). Criterio del usuario: centrarse en lo más consumido en
    # España (volumen del panel de consumo), incluyendo siempre trigo, arroz y AOVE;
    # el resto se incluye por la cadena de costes. Europa: pendiente (el portal
    # agroalimentario de la UE estaba suspendido), salvo el azúcar.
    # Aceites: de €/100 kg a €/litro con la densidad (oliva 0,916; girasol 0,92).
    - id: agricolas
      nombre: "Agrícolas principales"
      pestana: "Agricultura"      # comparte pestaña con las agrícolas de apoyo
      descripcion: >
        Los alimentos de origen agrícola que más se consumen en España, más el trigo,
        el arroz y el aceite de oliva virgen extra, que se siguen siempre. En España se
        ve el precio en origen y el que se paga en la tienda.
      materias:
        - id: trigo
          nombre: "Trigo"
          ambitos:
            espana:
              fuente: mapa
              producto: "Trigo blando"
              unidad: "€/tonelada"
              frecuencia: semanal
              nota: "Precio en origen: trigo blando panificable, media nacional"
              tienda: {producto: "PAN FRESCO NORMAL", nombre: "pan", unidad: "€/kg", multiplicador: false,
                       explicacion: "El pan es un producto elaborado: el trigo es solo una parte de su coste, junto a la energía del horno, la mano de obra y la distribución. Por eso no se calcula cuántas veces es el precio en origen."}
            global:
              fuente: pink
              serie: "Wheat, US HRW"
              unidad: "$/tonelada"
              frecuencia: mensual
              nota: "Trigo rojo de invierno de EE. UU. (HRW), referencia mundial (Banco Mundial)"
        - id: arroz
          nombre: "Arroz"
          ambitos:
            espana:
              fuente: mapa
              producto: "Arroz blanco japónica"
              factor: 0.001          # de €/tonelada a €/kg, para compararlo con la tienda
              unidad: "€/kg"
              decimales: 3
              frecuencia: semanal
              nota: "Precio en origen: arroz blanco japónica (grano redondo) a granel, salida de industria"
              tienda: {producto: "ARROZ>NORMAL", nombre: "arroz redondo", unidad: "€/kg"}
            global:
              fuente: pink
              serie: "Rice, Thai 5%"
              unidad: "$/tonelada"
              frecuencia: mensual
              nota: "Arroz blanco tailandés, 5 % de grano partido (Banco Mundial)"
        - id: aove
          nombre: "Aceite de oliva virgen extra"
          ambitos:
            espana:
              fuente: mapa
              producto: "Aceite de oliva virgen extra"
              factor: 0.00916        # de €/100 kg a €/litro
              unidad: "€/litro"
              decimales: 2
              frecuencia: semanal
              nota: "Precio en origen: salida de almazara, a granel, media nacional"
              tienda: {producto: "A.O VIRGEN EXTRA", unidad: "€/litro"}
            global:
