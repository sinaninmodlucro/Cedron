# =============================================================================
# Calendario de fechas clave (11-nov-2026). Pagina «Calendario» y «Próximas fechas» de la
# portada y del resumen semanal. Las reuniones de la Fed y del BCE se leen solas de sus
# webs cada semana. Aqui van las fechas fijas (siempre con su fuente: no se inventa
# ninguna) y las publicaciones periodicas (dia_semana: 0 = lunes; dia_mes: numero o
# «ultimo_laborable»), que se muestran como «habitualmente» porque los festivos las mueven.
# Las fechas de las medidas regulatorias salen de la seccion 'medidas'.
# Pendiente: el USDA bloquea los lectores automaticos; sus fechas de 2027 se anaden a mano
# cuando las publique (usda.gov/wasde). El INE publica su calendario de 2027 en diciembre.
# =============================================================================
calendario:
  tipos:
    banco_central: {nombre: "Bancos centrales"}
    datos: {nombre: "Datos oficiales"}
    cosechas: {nombre: "Cosechas y alimentos"}
    energia: {nombre: "Energía"}
    medida: {nombre: "Medidas regulatorias"}
    prevision: {nombre: "Nuestras previsiones"}
  fechas:
    - fecha: "2026-12-10"
      titulo: "USDA: informe mundial de oferta y demanda agrícola (WASDE)"
      tipo: cosechas
      materias: [trigo, maiz, soja, arroz, algodon, azucar]
      fuente: "USDA, calendario WASDE de 2026"
      enlace: "https://www.usda.gov/oce/commodity/wasde"
  periodicas:
    - titulo: "EIA: existencias semanales de petróleo en EE. UU."
      tipo: energia
      dia_semana: 2
      materias: [brent, wti, diesel]
      fuente: "EIA, Weekly Petroleum Status Report"
      enlace: "https://www.eia.gov/petroleum/supply/weekly/"
    - titulo: "CFTC: posiciones de los especuladores en futuros"
      tipo: datos
      dia_semana: 4
      fuente: "CFTC, Commitments of Traders"
      enlace: "https://www.cftc.gov/MarketReports/CommitmentsofTraders/index.htm"
    - titulo: "Comisión Europea: precios semanales de los carburantes (Oil Bulletin)"
      tipo: energia
